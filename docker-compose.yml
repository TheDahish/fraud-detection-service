# Local run: `cp .env.example .env`, fill in the values, then `docker compose up --build`.
services:
  fraud-detection-service:
    build: .
    image: fraud-detection-service:local
    ports:
      - "8080:8080"
    environment:
      FRAUD_JWKS_URI: ${FRAUD_JWKS_URI:?set FRAUD_JWKS_URI in .env}
      FRAUD_JWT_ISSUER: ${FRAUD_JWT_ISSUER:?set FRAUD_JWT_ISSUER in .env}
      FRAUD_JWT_AUDIENCE: ${FRAUD_JWT_AUDIENCE:-fraud-detection-service}
      FRAUD_CARD_TOKEN_KEY: ${FRAUD_CARD_TOKEN_KEY:?set FRAUD_CARD_TOKEN_KEY in .env}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped
