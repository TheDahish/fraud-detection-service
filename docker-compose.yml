# Local run: `docker compose up --build`. Values come from .env (see .env.example).
services:
  fraud-detection-service:
    build: .
    image: fraud-detection-service:local
    ports:
      - "8070:8070"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped
    # Ships stdout (already masked by the app) to a local Splunk HEC endpoint.
    # Non-blocking, so a Splunk outage drops log lines instead of stalling requests.
    # Note: `docker logs` is not available while this driver is set.
    logging:
      driver: splunk
      options:
        # host.docker.internal reaches the host from inside Docker Desktop.
        splunk-url: ${SPLUNK_HEC_URL:-https://host.docker.internal:8088}
        splunk-token: ${SPLUNK_HEC_TOKEN:-}
        splunk-verify-connection: "false"
        # Local Splunk uses a self-signed certificate. Development only.
        splunk-insecureskipverify: "true"
        splunk-format: raw
        splunk-sourcetype: fraud-detection-service
        mode: non-blocking
        max-buffer-size: 4m
